<div class="app-container">
  <!-- Navegación fija compartida por todas las páginas. -->
  <nav class="navbar">
    <h1>Mi App Angular</h1>
    <ul class="nav-menu">
      <!-- routerLink cambia de vista sin recargar toda la aplicación. -->
      <li>
        <a routerLink="/home"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}">
          Inicio
        </a>
      </li>
      <li>
        <a routerLink="/services"
           routerLinkActive="active">
          Servicios
        </a>
      </li>
      <li>
        <a routerLink="/about"
           routerLinkActive="active">
          Acerca de
        </a>
      </li>
      <li>
        <a routerLink="/contact"
           routerLinkActive="active">
          Contacto
        </a>
      </li>
      <li>
        <a routerLink="/quotation"
           routerLinkActive="active">
          Cotización
        </a>
      </li>
      <li>
        <a routerLink="/login"
           routerLinkActive="active">
          Iniciar sesión
        </a>
      </li>
    </ul>
  </nav>

  <!-- Angular inserta aquí el componente correspondiente a la ruta actual. -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer compartido: se mantiene visible en todas las rutas. -->
  <footer class="site-footer">
    <div class="footer-brand">
      <h2>Mi App Angular</h2>
      <p>Soluciones digitales para hacer crecer tu negocio.</p>
    </div>

    <nav class="footer-links" aria-label="Enlaces del pie de página">
      <!-- Estos enlaces reutilizan el mismo sistema de routing de la barra superior. -->
      <a routerLink="/home">Inicio</a>
      <a routerLink="/services">Servicios</a>
      <a routerLink="/about">Acerca de</a>
      <a routerLink="/contact">Contacto</a>
      <a routerLink="/quotation">Cotización</a>
      <a routerLink="/login">Iniciar sesión</a>
    </nav>

    <div class="footer-contact">
      <span>contacto&#64;miapp.com</span>
      <span>© 2026 Mi App Angular</span>
    </div>
  </footer>
</div>
